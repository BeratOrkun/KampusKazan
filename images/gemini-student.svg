<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F2B" />
      <stop offset="50%" stop-color="#141B4D" />
      <stop offset="100%" stop-color="#070A1E" />
    </linearGradient>
    <linearGradient id="geminiSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="120" r="140" fill="#8B5CF6" opacity="0.25" filter="url(#glow)" />
  <circle cx="160" cy="340" r="160" fill="#3B82F6" opacity="0.2" filter="url(#glow)" />

  <!-- Gemini Star Big -->
  <g transform="translate(560, 90)">
    <path d="M110 0 C110 60.75 60.75 110 0 110 C60.75 110 110 159.25 110 220 C110 159.25 159.25 110 220 110 C159.25 110 110 60.75 110 0 Z" fill="url(#geminiSparkle)" filter="url(#glow)" opacity="0.9" />
    <path d="M110 30 C110 74.18 74.18 110 30 110 C74.18 110 110 145.82 110 190 C110 145.82 145.82 110 190 110 C145.82 110 110 74.18 110 30 Z" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Small Gemini Star -->
  <g transform="translate(500, 240) scale(0.35)">
    <path d="M110 0 C110 60.75 60.75 110 0 110 C60.75 110 110 159.25 110 220 C110 159.25 159.25 110 220 110 C159.25 110 110 60.75 110 0 Z" fill="url(#geminiSparkle)" opacity="0.8" />
  </g>

  <!-- Content Left -->
  <g transform="translate(60, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(139, 92, 246, 0.2)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5" />
    <text x="110" y="22" fill="#E9D5FF" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle" letter-spacing="0.04em">✨ 1 YIL BOYUNCA TAMAMEN ÜCRETSİZ</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#FFFFFF" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.03em">Google Gemini Pro</text>
    <text x="0" y="136" fill="url(#textGrad)" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.02em">Öğrenci AI Paketi 🚀</text>

    <!-- Subtitle Bullet Points -->
    <text x="0" y="195" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-weight="500" font-size="16">⚡ Gelişmiş Gemini 1.5 Pro / 2.0 modelleri ve derin analiz</text>
    <text x="0" y="228" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-weight="500" font-size="16">☁️ 2 TB Google Drive, Gmail ve Fotoğraflar bulut depolama</text>
    <text x="0" y="261" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-weight="500" font-size="16">🎓 Üniversite öğrencilerine özel yıllık ₺8.600 değerinde fırsat</text>
  </g>
</svg>
