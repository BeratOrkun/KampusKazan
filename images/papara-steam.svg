<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="steamBg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101822"/>
      <stop offset="50%" stop-color="#172535"/>
      <stop offset="100%" stop-color="#0B1118"/>
    </linearGradient>
    <linearGradient id="steamBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66C0F4"/>
      <stop offset="100%" stop-color="#1999DF"/>
    </linearGradient>
    <linearGradient id="goldSteam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF570"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#FFA826"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="24" fill="url(#steamBg)"/>
  <circle cx="710" cy="90" r="190" fill="#1999DF" fill-opacity="0.25"/>
  <circle cx="100" cy="350" r="170" fill="#66C0F4" fill-opacity="0.12"/>

  <!-- Brand White Pill -->
  <rect x="44" y="38" width="180" height="52" rx="14" fill="#FFFFFF"/>
  <g transform="translate(56, 48)">
    <rect width="26" height="26" rx="7" fill="#111113"/>
    <path d="M9 8H14C16 8 18 9.5 18 11.5C18 13.5 16 15 14 15H9V8Z" fill="#FFFFFF"/>
    <path d="M9 15H12V20H9V15Z" fill="#F63854"/>
    <text x="34" y="19" fill="#111113" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16">papara</text>
  </g>

  <!-- Tag -->
  <rect x="238" y="44" width="220" height="40" rx="20" fill="url(#steamBlueGrad)"/>
  <text x="348" y="69" text-anchor="middle" fill="#0B1118" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="14" letter-spacing="0.5">🎮 STEAM CASHBACK</text>

  <!-- Main Headlines -->
  <text x="44" y="158" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="33">Steam Harcamalarında</text>
  <text x="44" y="220" fill="url(#steamBlueGrad)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">%50 Nakit İade!</text>
  <text x="44" y="270" fill="#BAE6FD" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="18">300 TL'ye Kadar Yapacağın Harcamalarda 150 TL Anında Hesabına</text>

  <rect x="44" y="316" width="440" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#66C0F4" stroke-width="1.8"/>
  <text x="64" y="351" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="16">🕹️ Oyun İndirimlerinde Çifte Fırsat • Papara Card ile Öde</text>

  <!-- Right Visual Feature Card -->
  <g transform="translate(520, 85)">
    <rect x="0" y="0" width="236" height="280" rx="24" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
    
    <circle cx="118" cy="74" r="44" fill="url(#steamBlueGrad)"/>
    <text x="118" y="86" text-anchor="middle" fill="#0B1118" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="30">🎮</text>

    <text x="118" y="156" text-anchor="middle" fill="#66C0F4" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34">150 TL</text>
    <text x="118" y="186" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="15">Nakit İade</text>
    <rect x="24" y="216" width="188" height="28" rx="14" fill="#172535" stroke="#66C0F4" stroke-width="1.2"/>
    <text x="118" y="234" text-anchor="middle" fill="#BAE6FD" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Steam Store</text>
