  <!-- Main Headlines -->
  <text x="44" y="158" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="33">Ek Kredi Kartı Başvuruna</text>
  <text x="44" y="218" fill="url(#odeaCyanLime)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">250 TL İndirim!</text>
  <text x="44" y="268" fill="#D0E7FF" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="18">İlk Kez Ek Kart Çıkart, 1.000 TL Harcamana 250 TL Kazan</text>

