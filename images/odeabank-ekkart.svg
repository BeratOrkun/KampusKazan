  <rect width="800" height="420" rx="24" fill="url(#odeaEkBg)"/>
  <circle cx="700" cy="110" r="220" fill="#0055B8" fill-opacity="0.3"/>
  <circle cx="120" cy="350" r="170" fill="#00F0FF" fill-opacity="0.12"/>

