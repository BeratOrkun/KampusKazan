  </defs>

  <rect width="800" height="420" rx="24" fill="url(#ingKafeBg)"/>
  <circle cx="710" cy="80" r="190" fill="#FF9E00" fill-opacity="0.2"/>
  <circle cx="120" cy="360" r="170" fill="#FF6200" fill-opacity="0.2"/>

  <!-- Brand White Pill -->
  <rect x="44" y="38" width="190" height="52" rx="14" fill="#FFFFFF"/>
  <g transform="translate(56, 48)">
