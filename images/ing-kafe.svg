  <text x="44" y="222" fill="url(#goldIngKafe)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">450 TL Bonus Fırsatı!</text>
  <text x="44" y="272" fill="#FED7AA" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20">200 TL Harcamaya 50 TL • İstanbulkart Yüklemelerine %50 Bonus (250 TL)</text>

  <rect x="44" y="316" width="430" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FF9E00" stroke-width="1.8"/>
