  <text x="363" y="69" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">🍔 KAFE &amp; İSTANBULKART</text>

