    <text x="13" y="19" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="14" text-anchor="middle">🦁</text>
    <text x="34" y="15" fill="#FF6200" font-family="-apple-system, sans-serif" font-weight="900" font-size="14">ING</text>
    <rect x="34" y="19" width="76" height="10" rx="3" fill="#525199"/>
