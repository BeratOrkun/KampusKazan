      <stop offset="0%" stop-color="#260C00"/>
      <stop offset="50%" stop-color="#4D1900"/>
      <stop offset="100%" stop-color="#140600"/>
    </linearGradient>
    <linearGradient id="ingKafeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#FF6200"/>
