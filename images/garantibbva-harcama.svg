  <rect width="800" height="420" rx="24" fill="url(#garantiBg1)"/>
  <circle cx="710" cy="80" r="190" fill="#00A349" fill-opacity="0.18"/>
  <circle cx="120" cy="360" r="170" fill="#10B981" fill-opacity="0.16"/>

  <!-- Garanti BBVA Logo White Pill -->
  <rect x="44" y="38" width="180" height="52" rx="14" fill="#FFFFFF"/>
