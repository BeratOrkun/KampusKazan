<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paycellDijBg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02142B"/>
      <stop offset="50%" stop-color="#0A2449"/>
      <stop offset="100%" stop-color="#010A16"/>
    </linearGradient>
    <linearGradient id="paycellGoldDij" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF570"/>
      <stop offset="50%" stop-color="#FFC709"/>
      <stop offset="100%" stop-color="#FFA826"/>
    </linearGradient>
    <linearGradient id="paycellCyanDij" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00A3E0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="24" fill="url(#paycellDijBg)"/>
  <circle cx="710" cy="90" r="190" fill="#00A3E0" fill-opacity="0.25"/>
  <circle cx="100" cy="350" r="170" fill="#FFC709" fill-opacity="0.15"/>

  <!-- Brand White Pill -->
  <rect x="44" y="38" width="180" height="52" rx="14" fill="#FFFFFF"/>
  <g transform="translate(56, 48)">
    <rect width="26" height="26" rx="7" fill="#002855"/>
    <circle cx="13" cy="13" r="7" fill="#FFC709"/>
    <text x="34" y="19" fill="#002855" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16">pay<tspan fill="#00A3E0">cell</tspan></text>
  </g>

  <!-- Tag -->
  <rect x="238" y="44" width="240" height="40" rx="20" fill="url(#paycellCyanDij)"/>
  <text x="358" y="69" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="13" letter-spacing="0.5">🎬 SPOTIFY, NETFLIX &amp; PRIME</text>

  <!-- Main Headlines -->
  <text x="44" y="158" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="33">Dijital Platform Üyeliklerinin</text>
  <text x="44" y="220" fill="url(#paycellGoldDij)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">%50'si Bizden!</text>
  <text x="44" y="270" fill="#BAE6FD" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="18">Paycell Kart ile Yapacağın Netflix, Spotify ve Prime Harcamalarında %50 İade</text>

  <rect x="44" y="316" width="440" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#00A3E0" stroke-width="1.8"/>
  <text x="64" y="351" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="16">🍿 Dizi, Film, Müzik ve Hızlı Kargo • Her Ay Düzenli %50 İade</text>

  <!-- Right Visual Feature Card -->
  <g transform="translate(520, 85)">
    <rect x="0" y="0" width="236" height="280" rx="24" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
    
    <circle cx="118" cy="74" r="44" fill="url(#paycellCyanDij)"/>
    <text x="118" y="86" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">🎬🎵</text>

    <text x="118" y="156" text-anchor="middle" fill="#FFC709" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="38">%50</text>
    <text x="118" y="186" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="15">Nakit İade</text>
    <rect x="24" y="216" width="188" height="28" rx="14" fill="#002855"/>
    <text x="118" y="234" text-anchor="middle" fill="#FFC709" font-family="'Inter', sans-serif" font-weight="700" font-size="11">Spotify + Netflix + Prime</text>
    <text x="118" y="266" text-anchor="middle" fill="#BAE6FD" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Paycell Kart ile Öde</text>
  </g>
