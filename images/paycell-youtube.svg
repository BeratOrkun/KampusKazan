  </defs>

  <rect width="800" height="420" rx="24" fill="url(#paycellYtBg)"/>
  <circle cx="710" cy="90" r="190" fill="#DC2626" fill-opacity="0.25"/>
  <circle cx="100" cy="350" r="170" fill="#FFC709" fill-opacity="0.12"/>

  <!-- Brand White Pill -->
  <rect x="44" y="38" width="180" height="52" rx="14" fill="#FFFFFF"/>
  <g transform="translate(56, 48)">
    <rect width="26" height="26" rx="7" fill="#002855"/>
    <circle cx="13" cy="13" r="7" fill="#FFC709"/>
    <text x="34" y="19" fill="#002855" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16">pay<tspan fill="#00A3E0">cell</tspan></text>
  </g>

  <!-- Tag -->
  <rect x="238" y="44" width="230" height="40" rx="20" fill="url(#ytRedGrad)"/>
  <text x="353" y="69" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="14" letter-spacing="0.5">🎁 2 AY HEDİYE</text>

  <!-- Main Headlines -->
  <text x="44" y="158" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="33">Paycell ile YouTube Premium</text>
  <text x="44" y="220" fill="url(#goldYt)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">2 Ay Ücretsiz!</text>
  <text x="44" y="270" fill="#FECACA" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="18">Turkcell Faturana Yansıtarak Harcama Yap • 2 Ay YouTube Premium Kazan</text>

  <rect x="44" y="316" width="440" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#DC2626" stroke-width="1.8"/>
  <text x="64" y="351" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="16">▶️ Reklamsız Video, Arka Planda Çalma ve YouTube Music Hediye</text>

