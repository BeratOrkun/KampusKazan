    <circle cx="118" cy="74" r="44" fill="url(#ytRedGrad)"/>
    <polygon points="112,62 128,74 112,86" fill="#FFFFFF"/>

    <text x="118" y="156" text-anchor="middle" fill="#FFC709" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34">2 AY</text>
    <text x="118" y="186" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="15">Tamamen Ücretsiz</text>
    <rect x="24" y="216" width="188" height="28" rx="14" fill="#2B0F0F" stroke="#DC2626" stroke-width="1.2"/>
    <text x="118" y="234" text-anchor="middle" fill="#FECACA" font-family="'Inter', sans-serif" font-weight="700" font-size="12">YouTube Premium</text>
    <text x="118" y="266" text-anchor="middle" fill="#9CA3AF" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Tüm Turkcelliler İçin</text>
