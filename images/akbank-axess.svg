<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="axessBg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0A0C"/>
      <stop offset="50%" stop-color="#380E13"/>
      <stop offset="100%" stop-color="#120406"/>
    </linearGradient>
    <linearGradient id="axessGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="chipParaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4D58"/>
      <stop offset="100%" stop-color="#E30613"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="24" fill="url(#axessBg)"/>
  <circle cx="690" cy="90" r="190" fill="#FFC107" fill-opacity="0.16"/>
  <circle cx="110" cy="360" r="170" fill="#E30613" fill-opacity="0.2"/>

  <!-- Akbank Brand Logo White Pill -->
  <rect x="44" y="38" width="160" height="52" rx="14" fill="#FFFFFF"/>
  <rect x="54" y="46" width="140" height="36" rx="8" fill="#E30613"/>
  <text x="124" y="70" fill="#FFFFFF" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="1.5" text-anchor="middle">AKBANK</text>

  <!-- Axess Öğrenci Badge -->
  <rect x="220" y="44" width="180" height="40" rx="20" fill="url(#chipParaGrad)"/>
  <text x="310" y="69" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">💳 AXESS ÖĞRENCİ</text>

  <!-- Main Headlines -->
  <text x="44" y="160" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34">Axess Öğrenci ile</text>
  <text x="44" y="222" fill="url(#axessGold)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">1.200 TL Chip-Para!</text>
  <text x="44" y="272" fill="#FDE68A" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20">Her 500 TL Harcamaya 300 TL • İlk Yıl Kart Aidatı 0 TL</text>

  <rect x="44" y="316" width="410" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFC107" stroke-width="1.8"/>
  <text x="66" y="351" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="17">📱 Juzdan'dan Katıl • 30 Kasım'a Kadar Geçerli</text>

  <!-- Right Visual Feature Card -->
  <g transform="translate(520, 90)">
    <rect x="0" y="0" width="236" height="276" rx="24" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="118" cy="80" r="46" fill="url(#chipParaGrad)"/>
    <text x="118" y="90" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34">🎁✨</text>
    <text x="118" y="164" text-anchor="middle" fill="#FFE57F" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="32">1.200 TL</text>
    <text x="118" y="196" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Toplam Chip-Para</text>
    <rect x="28" y="222" width="180" height="32" rx="16" fill="#FFC107" fill-opacity="0.3"/>
    <text x="118" y="243" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="13">İlk Yıl Kart Ücretsiz</text>
  </g>
</svg>
