<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="enparaDavetBg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A072B"/>
      <stop offset="50%" stop-color="#300C50"/>
      <stop offset="100%" stop-color="#0E031A"/>
    </linearGradient>
    <linearGradient id="enparaPurpleBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#5F259F"/>
    </linearGradient>
    <linearGradient id="goldEnparaDavet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#FFA826"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="24" fill="url(#enparaDavetBg)"/>
  <circle cx="710" cy="80" r="190" fill="#A855F7" fill-opacity="0.2"/>
  <circle cx="120" cy="360" r="170" fill="#5F259F" fill-opacity="0.25"/>

  <!-- Brand White Pill -->
  <rect x="44" y="38" width="190" height="52" rx="14" fill="#FFFFFF"/>
  <g transform="translate(56, 48)">
    <rect width="26" height="26" rx="6" fill="#5F259F"/>
    <text x="13" y="19" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="14" text-anchor="middle">en</text>
    <text x="34" y="19" fill="#5F259F" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="14">enpara<tspan fill="#A855F7">.com</tspan></text>
  </g>

  <!-- Tag -->
  <rect x="248" y="44" width="220" height="40" rx="20" fill="url(#enparaPurpleBadge)"/>
  <text x="358" y="69" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">👥 TAVSİYE İLE KAZAN</text>

  <!-- Main Headlines -->
  <text x="44" y="160" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34">Arkadaşını Enpara'lı Yap</text>
  <text x="44" y="222" fill="url(#goldEnparaDavet)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">Kişi Başı 1.000 TL Kazan!</text>
  <text x="44" y="272" fill="#E9D5FF" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20">Hesap Açan Her Yakının İçin 500 TL • Kredi Kartı Alırsa 1.000 TL Ödül</text>

  <rect x="44" y="316" width="430" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#A855F7" stroke-width="1.8"/>
  <text x="66" y="351" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="17">📅 30 Haziran 2027'ye Kadar • Cep Şube'den Tavsiye Et</text>

  <!-- Right Visual Feature Card -->
  <g transform="translate(520, 90)">
    <rect x="0" y="0" width="236" height="276" rx="24" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="118" cy="80" r="46" fill="url(#enparaPurpleBadge)"/>
    <text x="118" y="90" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34">🎁💰</text>
    <text x="118" y="164" text-anchor="middle" fill="#FFD100" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34">1.000 TL</text>
    <text x="118" y="196" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Kişi Başı Nakit Ödül</text>
    <rect x="24" y="222" width="188" height="32" rx="16" fill="#5F259F" fill-opacity="0.8"/>
    <text x="118" y="243" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Enpara Kredi Kartı</text>
  </g>
