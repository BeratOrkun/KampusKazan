<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ykPlayBg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#031024"/>
      <stop offset="50%" stop-color="#082552"/>
      <stop offset="100%" stop-color="#020B1A"/>
    </linearGradient>
    <linearGradient id="ykGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="ykBlueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0055B8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="24" fill="url(#ykPlayBg)"/>
  <circle cx="710" cy="80" r="190" fill="#00A3FF" fill-opacity="0.18"/>
  <circle cx="120" cy="360" r="170" fill="#FFD100" fill-opacity="0.15"/>

  <!-- Yapı Kredi Play Logo White Pill -->
  <rect x="44" y="38" width="180" height="52" rx="14" fill="#FFFFFF"/>
  <g transform="translate(56, 47)">
    <g transform="translate(2, 3)">
      <circle cx="12" cy="12" r="10" fill="#002D72"/>
      <circle cx="12" cy="12" r="5" fill="#00A3FF"/>
    </g>
    <text x="32" y="16" fill="#002D72" font-family="-apple-system, sans-serif" font-weight="800" font-size="13">Yapı Kredi</text>
    <rect x="32" y="20" width="38" height="11" rx="4" fill="#FFCC00"/>
    <text x="51" y="28.5" fill="#002D72" font-family="-apple-system, sans-serif" font-weight="900" font-size="8.5" letter-spacing="0.5" text-anchor="middle">play</text>
  </g>

  <!-- Tag -->
  <rect x="238" y="44" width="200" height="40" rx="20" fill="url(#ykBlueAccent)"/>
  <text x="338" y="69" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">🎮 PLAY'LİLERE ÖZEL</text>

  <!-- Main Headlines -->
  <text x="44" y="160" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="34">Yapı Kredi Mobil ile Play'lilere</text>
  <text x="44" y="222" fill="url(#ykGoldGrad)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">15.000 TL Fırsat!</text>
  <text x="44" y="272" fill="#BAE6FD" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="20">6.000 TL Harcama • 6.000 TL Davet • Ücretsiz EFT &amp; Havale</text>

  <rect x="44" y="316" width="430" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFD100" stroke-width="1.8"/>
  <text x="66" y="351" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="17">🔑 Referans Kodu: <tspan fill="#FFD100" font-weight="900">PLAY2026</tspan> • 18-26 Yaş Arası</text>

  <!-- Right Visual Feature Card -->
  <g transform="translate(520, 90)">
    <rect x="0" y="0" width="236" height="276" rx="24" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="118" cy="80" r="46" fill="url(#ykBlueAccent)"/>
    <text x="118" y="90" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34">💳⚡</text>
    <text x="118" y="164" text-anchor="middle" fill="#FFD100" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="32">15.000 TL</text>
    <text x="118" y="196" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">Toplam Play Paketi</text>
    <rect x="24" y="222" width="188" height="32" rx="16" fill="#FFD100" fill-opacity="0.3"/>
    <text x="118" y="243" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="13">Kod: PLAY2026</text>
  </g>
</svg>
