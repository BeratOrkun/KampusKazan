<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paycellGiyimBg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02142B"/>
      <stop offset="50%" stop-color="#0B2B59"/>
      <stop offset="100%" stop-color="#010914"/>
    </linearGradient>
    <linearGradient id="giyimBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="giyimGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF570"/>
      <stop offset="50%" stop-color="#FFC709"/>
      <stop offset="100%" stop-color="#FFA826"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="24" fill="url(#paycellGiyimBg)"/>
  <circle cx="710" cy="90" r="190" fill="#2563EB" fill-opacity="0.25"/>
  <circle cx="100" cy="350" r="170" fill="#FFC709" fill-opacity="0.12"/>

  <!-- Brand White Pill -->
  <rect x="44" y="38" width="180" height="52" rx="14" fill="#FFFFFF"/>
  <g transform="translate(56, 48)">
    <rect width="26" height="26" rx="7" fill="#002855"/>
    <circle cx="13" cy="13" r="7" fill="#FFC709"/>
    <text x="34" y="19" fill="#002855" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16">pay<tspan fill="#00A3E0">cell</tspan></text>
  </g>

  <!-- Tag -->
  <rect x="238" y="44" width="230" height="40" rx="20" fill="url(#giyimBlueGrad)"/>
  <text x="353" y="69" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="14" letter-spacing="0.5">👕 GİYİM &amp; AYAKKABI</text>

  <!-- Main Headlines -->
  <text x="44" y="158" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="33">Mavi, DeFacto ve FLO'da</text>
  <text x="44" y="220" fill="url(#giyimGold)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">%20'ye Varan İade!</text>
  <text x="44" y="270" fill="#BFDBFE" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="18">Mavi'de %20, DeFacto'da %20, FLO'da %15 Anında Nakit İade Fırsatı</text>

  <rect x="44" y="316" width="440" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="64" y="351" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="16">👟 Kampüs Kombinlerinde • Paycell Kart ile Alışveriş Kazandırıyor</text>

  <!-- Right Visual Feature Card -->
  <g transform="translate(520, 85)">
    <rect x="0" y="0" width="236" height="280" rx="24" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
    
    <circle cx="118" cy="74" r="44" fill="url(#giyimBlueGrad)"/>
    <text x="118" y="86" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28">👕👟</text>

    <text x="118" y="156" text-anchor="middle" fill="#FFC709" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="38">%20</text>
    <text x="118" y="186" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="15">Nakit İade</text>
    <rect x="24" y="216" width="188" height="28" rx="14" fill="#002855"/>
    <text x="118" y="234" text-anchor="middle" fill="#FFC709" font-family="'Inter', sans-serif" font-weight="700" font-size="11">Mavi • DeFacto • FLO</text>
    <text x="118" y="266" text-anchor="middle" fill="#BFDBFE" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Paycell Kart Ayrıcalığı</text>
  </g>
