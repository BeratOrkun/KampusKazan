<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="odeaBlueBg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#051B3B"/>
      <stop offset="50%" stop-color="#003580"/>
      <stop offset="100%" stop-color="#001830"/>
    </linearGradient>
    <linearGradient id="odeaLimeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8FF59"/>
      <stop offset="100%" stop-color="#B8E900"/>
    </linearGradient>
    <linearGradient id="odeaCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0055B8"/>
      <stop offset="100%" stop-color="#002D72"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="24" fill="url(#odeaBlueBg)"/>
  <circle cx="720" cy="90" r="200" fill="#0055B8" fill-opacity="0.35"/>
  <circle cx="100" cy="360" r="180" fill="#B8E900" fill-opacity="0.12"/>

  <!-- Brand White Pill -->
  <rect x="44" y="38" width="190" height="52" rx="14" fill="#FFFFFF"/>
  <g transform="translate(56, 48)">
    <rect width="26" height="26" rx="6" fill="#0055B8"/>
    <rect x="7" y="7" width="12" height="12" rx="3" fill="#D4F636"/>
    <text x="36" y="19" fill="#003580" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="15">odea<tspan fill="#0055B8" font-weight="700">bank</tspan></text>
  </g>

  <!-- Tag -->
  <rect x="248" y="44" width="220" height="40" rx="20" fill="url(#odeaLimeGrad)"/>
  <text x="358" y="69" text-anchor="middle" fill="#002D72" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="0.5">💳 YENİ KART FIRSATI</text>

  <!-- Main Headlines -->
  <text x="44" y="158" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="33">Yeni Odea Kredi Kartınla</text>
  <text x="44" y="218" fill="url(#odeaLimeGrad)" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52">1.000 TL İndirim!</text>
  <text x="44" y="268" fill="#CFE2FE" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="18">5.000 TL Harcamaya 1.000 TL Anında Ekstre İndirimi</text>

  <rect x="44" y="316" width="440" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.1" stroke="#D4F636" stroke-width="1.8"/>
  <text x="64" y="351" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="16">✨ Hemen Başvur • Onaylansın • 1.000 TL Cebinde Kalsın</text>

  <!-- Right Visual Feature Card -->
  <g transform="translate(520, 85)">
    <rect x="0" y="0" width="236" height="280" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Mini Credit Card Mockup -->
    <g transform="translate(28, 30)">
      <rect width="180" height="110" rx="14" fill="url(#odeaCardGrad)" stroke="#D4F636" stroke-width="2"/>
      <rect x="18" y="22" width="28" height="20" rx="4" fill="#D4F636"/>
      <circle cx="145" cy="32" r="12" fill="#FFFFFF" fill-opacity="0.3"/>
      <circle cx="155" cy="32" r="12" fill="#D4F636" fill-opacity="0.6"/>
      <text x="18" y="76" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" letter-spacing="2">••••  4820</text>
      <text x="18" y="96" fill="#D4F636" font-family="'Inter', sans-serif" font-weight="800" font-size="10">ODEA CARD</text>
    </g>

    <text x="118" y="195" text-anchor="middle" fill="#D4F636" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34">1.000 TL</text>
    <text x="118" y="225" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="15">Net İndirim</text>
    <rect x="24" y="246" width="188" height="28" rx="14" fill="#0055B8"/>
    <text x="118" y="264" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="12">5.000 TL Harcamaya</text>
  </g>
</svg>
